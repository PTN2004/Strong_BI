version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: strongbi-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: strongbi-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: strongbi-postgres
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=strongbi_auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  falkordb_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
