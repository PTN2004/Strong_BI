[project]
name = "strongbi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PhamNgocTu", email = "phamtu522004tanlap@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.83.0",
    "falkordb~=1.6.0",
    "psycopg2-binary~=2.9.12",
    "pymysql~=1.1.0",
    "jsonschema~=4.26.0",
    "tqdm~=4.67.3",
    "neo4j>=5.0.0",
    "fastapi~=0.136.1",
    "uvicorn~=0.46.0",
    "authlib~=1.7.0",
    "itsdangerous~=2.2.0",
    "python-multipart~=0.0.27",
    "jinja2~=3.1.4",
    "fastmcp>=3.2.4",
    "graphiti-core>=0.28.1",
    "snowflake-connector-python~=4.4.0",
    "python-dotenv~=1.2.2",
    "aiohttp>=3.13.5",
    "sqlalchemy>=2.0.51",
    "sqlglot>=23.0.0",
    "pandas>=3.0.5",
    "langgraph>=1.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["api"]
